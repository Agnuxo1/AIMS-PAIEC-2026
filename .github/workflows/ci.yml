name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Fast checks (no data download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synthetic metric and inference tests
        run: python audit/test_data_and_inference.py

      - name: Submission archives are valid and self-contained
        run: python ci/check_submissions.py

      - name: Figures and animations regenerate from committed results
        run: |
          python build/make_figures.py --repo . --out /tmp/figs
          python build/make_gifs.py --out /tmp/figs
          (cd build && python make_e1_figures.py --repo .. --out /tmp/figs)
          ls -la /tmp/figs
